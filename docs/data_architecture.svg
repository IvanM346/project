<svg viewBox="0 0 1550 650" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1550" height="650" fill="#ffffff"/>

  <rect x="10" y="10" width="1530" height="70" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="34" y="55" font-size="28" font-weight="700" fill="#1f2328">High Level Architecture</text>

  <!-- column headers -->
  <text x="40" y="128" font-size="18" font-weight="700" fill="#1f2328">Sources</text>
  <line x1="130" y1="124" x2="250" y2="124" stroke="#1f2328" stroke-dasharray="2,3"/>

  <text x="300" y="128" font-size="18" font-weight="700" fill="#1f2328">Data Warehouse</text>
  <text x="300" y="175" font-size="13" font-style="italic" fill="#57606a">SQL Server</text>

  <text x="1400" y="128" font-size="18" font-weight="700" fill="#1f2328">Consume</text>
  <line x1="1310" y1="124" x2="1395" y2="124" stroke="#1f2328" stroke-dasharray="2,3"/>

  <!-- dashed section borders -->
  <rect x="20" y="150" width="230" height="480" fill="none" stroke="#9aa0a6" stroke-dasharray="4,3"/>
  <rect x="280" y="150" width="1000" height="480" fill="none" stroke="#9aa0a6" stroke-dasharray="4,3"/>
  <rect x="1300" y="150" width="230" height="480" fill="none" stroke="#9aa0a6" stroke-dasharray="4,3"/>

  <!-- Sources -->
  <g font-size="14" fill="#1f2328">
    <rect x="50" y="200" width="140" height="50" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    <text x="120" y="230" text-anchor="middle" font-weight="700">CRM</text>

    <rect x="50" y="300" width="140" height="50" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    <text x="120" y="330" text-anchor="middle" font-weight="700">ERP</text>

    <line x1="50" y1="400" x2="190" y2="400" stroke="#1f2328"/>
    <text x="50" y="432" font-size="13" font-weight="700">Object Type:</text>
    <text x="50" y="452" font-size="13">CSV Files</text>
    <text x="50" y="480" font-size="13" font-weight="700">Interface:</text>
    <text x="50" y="500" font-size="13">Files in Folders</text>
  </g>

  <!-- Bronze -->
  <g>
    <rect x="310" y="190" width="300" height="410" fill="#ffffff" stroke="#e8a33d" stroke-width="1.5"/>
    <rect x="310" y="190" width="300" height="34" fill="#fdf0d5" stroke="#e8a33d" stroke-width="1.5"/>
    <text x="460" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Bronze Layer</text>
    <text x="460" y="246" text-anchor="middle" font-size="13" fill="#1f2328">Raw Data</text>
    <line x1="310" y1="258" x2="610" y2="258" stroke="#9aa0a6"/>

    <g font-size="13" fill="#1f2328">
      <text x="326" y="282" font-weight="700">Object Type:</text> <text x="430" y="282">Tables</text>
      <text x="326" y="322" font-weight="700">Load:</text>
      <text x="340" y="342">- Batch Processing</text>
      <text x="340" y="362">- Full Load</text>
      <text x="340" y="382">- Truncate &amp; Insert</text>
      <text x="326" y="422" font-weight="700">No Transformations</text>
      <text x="326" y="462" font-weight="700">Data Model:</text> <text x="430" y="462">None (as-is)</text>
    </g>
  </g>

  <!-- Silver -->
  <g>
    <rect x="640" y="190" width="300" height="410" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/>
    <rect x="640" y="190" width="300" height="34" fill="#f1f2f3" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="790" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Silver Layer</text>
    <text x="790" y="246" text-anchor="middle" font-size="13" fill="#1f2328">Cleaned, Standardized Data</text>
    <line x1="640" y1="258" x2="940" y2="258" stroke="#9aa0a6"/>

    <g font-size="13" fill="#1f2328">
      <text x="656" y="282" font-weight="700">Object Type:</text> <text x="760" y="282">Tables</text>
      <text x="656" y="322" font-weight="700">Load:</text>
      <text x="670" y="342">- Batch Processing</text>
      <text x="670" y="362">- Full Load</text>
      <text x="670" y="382">- Truncate &amp; Insert</text>
      <text x="656" y="422" font-weight="700">Transformations:</text>
      <text x="670" y="442">- Data Cleansing</text>
      <text x="670" y="462">- Data Standardization</text>
      <text x="670" y="482">- Data Normalization</text>
      <text x="670" y="502">- Derived Columns</text>
      <text x="670" y="522">- Data Enrichment</text>
      <text x="656" y="562" font-weight="700">Data Model:</text> <text x="760" y="562">None (as-is)</text>
    </g>
  </g>

  <!-- Gold -->
  <g>
    <rect x="970" y="190" width="300" height="410" fill="#ffffff" stroke="#e4c441" stroke-width="1.5"/>
    <rect x="970" y="190" width="300" height="34" fill="#fdf7dc" stroke="#e4c441" stroke-width="1.5"/>
    <text x="1120" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Gold Layer</text>
    <text x="1120" y="246" text-anchor="middle" font-size="13" fill="#1f2328">Business-Ready Data</text>
    <line x1="970" y1="258" x2="1270" y2="258" stroke="#9aa0a6"/>

    <g font-size="13" fill="#1f2328">
      <text x="986" y="282" font-weight="700">Object Type:</text> <text x="1090" y="282">Views</text>
      <text x="986" y="322" font-weight="700">No Load</text>
      <text x="986" y="362" font-weight="700">Transformations:</text>
      <text x="1000" y="382">- Data Integrations</text>
      <text x="1000" y="402">- Aggregations</text>
      <text x="1000" y="422">- Business Logics</text>
      <text x="986" y="462" font-weight="700">Data Model:</text>
      <text x="1000" y="482">- Star Schema</text>
      <text x="1000" y="502">- Flat Table</text>
      <text x="1000" y="522">- Aggregated Table</text>
    </g>
  </g>

  <!-- Consume -->
  <g font-size="13" fill="#1f2328">
    <rect x="1330" y="210" width="170" height="44" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    <text x="1415" y="237" text-anchor="middle" font-weight="700">BI &amp; Reporting</text>

    <rect x="1330" y="280" width="170" height="44" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    <text x="1415" y="297" text-anchor="middle" font-weight="700">Ad-Hoc</text>
    <text x="1415" y="313" text-anchor="middle" font-weight="700">SQL Queries</text>

    <rect x="1330" y="350" width="170" height="44" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    <text x="1415" y="377" text-anchor="middle" font-weight="700">Machine Learning</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f2328" stroke-width="2" fill="none">
    <path d="M 230 350 L 310 395" marker-end="url(#arrow)"/>
    <path d="M 610 395 L 640 395" marker-end="url(#arrow)"/>
    <path d="M 940 395 L 970 395" marker-end="url(#arrow)"/>
    <path d="M 1270 395 L 1330 325" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2328"/>
    </marker>
  </defs>
</svg>
